[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyrpa"
version = "0.1.0"
description = "CLI opinativa para scaffolding e orquestração declarativa de projetos RPA em Clean Architecture"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Kauê Cunha Baesso / Nícolas Paulo Nasário" }
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
    "jinja2>=3.1.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0"
]

[project.scripts]
pyrpa = "pyrpa.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["pyrpa*"]