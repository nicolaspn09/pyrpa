[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyrpa-framework"
version = "0.1.0"
description = "CLI opinativa para scaffolding e orquestração declarativa de projetos RPA em Clean Architecture"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Kauê Cunha Baesso" },
    { name = "Nícolas Paulo Nasário", email = "nicolaspn09@gmail.com" }
]
keywords = ["rpa", "clean-architecture", "automation", "airflow", "cli", "yaml", "pydantic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
    "jinja2>=3.1.0",
    "python-dotenv>=1.0.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "pypdf>=5.0.0",
    "sqlalchemy>=2.0.0",
    "selenium>=4.15.0",
    "playwright>=1.40.0",
    "openai>=1.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0"
]
undetected = [
    "undetected-chromedriver>=3.5.0"
]

[project.urls]
Homepage = "https://github.com/nicolaspn09/pyrpa"
Documentation = "https://github.com/nicolaspn09/pyrpa/blob/main/docs/MANUAL_DESENVOLVEDOR_PYRPA.md"
Repository = "https://github.com/nicolaspn09/pyrpa.git"

[project.scripts]
pyrpa = "pyrpa.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["pyrpa*"]
