[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyrpa"
version = "0.1.0"
description = "CLI opinativa para scaffolding e orquestração declarativa de projetos RPA em Clean Architecture"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Kauê Cunha Baesso / Nícolas Paulo Nasário" }
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
    "jinja2>=3.1.0",
    "python-dotenv>=1.0.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "pypdf>=5.0.0",
    "sqlalchemy>=2.0.0",
    "selenium>=4.15.0",
    "playwright>=1.40.0",
    "openai>=1.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0"
]
undetected = [
    "undetected-chromedriver>=3.5.0"
]

[project.scripts]
pyrpa = "pyrpa.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["pyrpa*"]
